---
version: 2

project_name: op-cached

before:
  hooks:
  - go mod tidy

builds:
- id: op-cached
  main: ./cmd/op-cached
  binary: op-cached
  env:
  # The keychain is reached through Security.framework, so cgo is required and
  # the release must be built on a macOS runner -- darwin/cgo cannot be
  # cross-compiled from Linux.
  - CGO_ENABLED=1
  flags:
  - -trimpath
  ldflags:
  - -s -w
  - -X main.version=v{{.Version}}
  - -X main.commit={{.Commit}}
  - -X main.date={{.Date}}
  # macOS only: op-cached has no meaning without a macOS keychain.
  goos:
  - darwin
  goarch:
  - amd64
  - arm64

archives:
- id: default
  formats: [tar.gz]
  name_template: >-
    {{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}
  files:
  - README.md
  - LICENSE*

homebrew_casks:
- name: op-cached
  ids:
  - default
  license: MIT
  repository:
    owner: sylr
    name: homebrew-tap
    token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
  homepage: "https://github.com/sylr/op-cached"
  description: "Cache 1Password CLI secret reads in the macOS keychain"
  caveats: "op-cached needs the 1Password CLI (op) on PATH."

checksum:
  name_template: "checksums.txt"

sboms:
- artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^test:"
    - "^chore:"

release:
  prerelease: auto
