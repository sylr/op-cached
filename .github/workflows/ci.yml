---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # macOS runner: keychain_darwin.go is built with cgo against
  # Security.framework, so it will not compile anywhere else.
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - run: go vet ./...
    - run: go test -race ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: goreleaser/goreleaser-action@v6
      with:
        version: "~> v2"
        args: check
